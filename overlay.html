<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
  .stage { position: absolute; inset: 0; }
  .actor { position: absolute; bottom: 6px; left: 0; display: none; will-change: transform; }
  .char { transform-origin: 50% 100%; }
  .char img, .char canvas { display: block; max-height: 340px; max-width: 260px; object-fit: contain;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.4)); pointer-events: none; -webkit-user-drag: none; }
  .placeholder { font-size: 110px; }
  .bubble {
    position: absolute; bottom: 100%; left: 50%; margin-bottom: 14px; width: 300px;
    transform: translateX(-50%) scale(.6); opacity: 0; transition: transform .25s ease-out, opacity .2s;
    background: #a8f0c6; color: #10201a; border: 3px solid #10201a; border-radius: 18px;
    padding: 12px 16px; box-shadow: 4px 4px 0 #10201a; pointer-events: auto;
  }
  .bubble.show { transform: translateX(-50%) scale(1); opacity: 1; }
  .bubble::after {
    content: ''; position: absolute; bottom: -16px; left: 50%; margin-left: -8px;
    border: 8px solid transparent; border-top: 14px solid #10201a;
  }
  .greet { font-weight: 800; font-size: 15px; }
  .msg { font-size: 15px; margin-top: 2px; font-weight: 600; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; border: 2px solid #10201a; border-radius: 10px; padding: 7px 0; font-weight: 700;
    font-size: 13px; cursor: pointer; background: #fff; color: #10201a;
  }
  button.yes { background: #10201a; color: #a8f0c6; }
  button:hover { transform: translateY(-1px); }
</style>
</head>
<body>
<div class="stage">
  <div class="actor" id="actor">
    <div class="bubble" id="bubble">
      <div class="greet" id="greet"></div>
      <div class="msg" id="msg"></div>
      <div class="btns" id="btns">
        <button class="yes" id="yes">Yes</button>
        <button id="later">Remind me later</button>
      </div>
    </div>
    <div class="char" id="char"></div>
  </div>
</div>
<script src="fx.js"></script>
<script>
  const actor = document.getElementById('actor');
  const bubble = document.getElementById('bubble');
  const charEl = document.getElementById('char');
  const greetEl = document.getElementById('greet');
  const msgEl = document.getElementById('msg');

  let media = null;
  let walker = null;
  let raf = null;
  let token = 0;
  let curWalk = true;
  let replyTimer = null;
  const btnsEl = document.getElementById('btns');
  let leaveWalkSpeed = 240;

  function stopAnim() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function disposeMedia() {
    if (media) media.dispose();
    if (walker) walker.dispose();
    media = null;
    walker = null;
    charEl.innerHTML = '';
  }

  // Builds the character element: an image, a video drawn on a canvas, or a placeholder.
  function makeMedia(m, rate) {
    if (!m) {
      const d = document.createElement('div');
      d.className = 'placeholder';
      d.textContent = '🙂';
      return { el: d, ready: Promise.resolve(), dispose() {} };
    }
    if (m.type === 'image') {
      const img = new Image();
      img.draggable = false;
      const ready = new Promise((res) => { img.onload = res; img.onerror = res; });
      img.src = m.src;
      return { el: img, ready, dispose() {} };
    }
    const blob = new Blob([m.bytes], { type: m.mime });
    const url = URL.createObjectURL(blob);
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true;
    v.defaultPlaybackRate = rate || 1;
    v.playbackRate = rate || 1;
    const c = document.createElement('canvas');
    const cx = c.getContext('2d', { willReadFrequently: true });
    let dead = false, last = 0, vraf = null;
    const loop = (now) => {
      if (dead) return;
      if (now - last >= 40 && v.readyState >= 2) {
        last = now;
        cx.clearRect(0, 0, c.width, c.height);
        cx.drawImage(v, 0, 0, c.width, c.height);
        const useDoodle = m.doodle && m.doodle.on;
        if (m.key || useDoodle) {
          const img = cx.getImageData(0, 0, c.width, c.height);
          if (m.key) BuddyFx.key(img.data, m.key, m.tol);
          if (useDoodle) BuddyFx.doodle(img, c.width, c.height, m.doodle);
          cx.putImageData(img, 0, 0);
        }
      }
      vraf = requestAnimationFrame(loop);
    };
    const ready = new Promise((res) => {
      v.onloadeddata = () => {
        const s = Math.min(1, 340 / v.videoHeight, 260 / v.videoWidth);
        c.width = Math.round(v.videoWidth * s);
        c.height = Math.round(v.videoHeight * s);
        v.playbackRate = rate || 1;
        v.play().catch(() => {});
        vraf = requestAnimationFrame(loop);
        res();
      };
      v.onerror = res;
    });
    v.src = url;
    return {
      el: c, ready,
      dispose() { dead = true; if (vraf) cancelAnimationFrame(vraf); v.pause(); v.removeAttribute('src'); URL.revokeObjectURL(url); }
    };
  }

  // Reads text aloud with a Windows voice that matches the language (Tamil or English).
  function speak(text) {
    try {
      speechSynthesis.cancel();
      if (!text) return;
      const lang = /[\u0B80-\u0BFF]/.test(text) ? 'ta' : 'en';
      const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(lang));
      if (!voice) return;
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.rate = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function place(x, bob, tilt) {
    actor.style.transform = 'translate(' + x + 'px,' + (-bob) + 'px)';
    charEl.style.transform = 'rotate(' + tilt + 'deg)';
  }

  window.buddy.onShow(async (p) => {
    const my = ++token;
    curWalk = !!p.walk;
    clearTimeout(replyTimer);
    greetEl.style.display = p.say ? 'none' : '';
    btnsEl.style.display = p.say ? 'none' : '';
    leaveWalkSpeed = p.walkMedia ? (p.walkMedia.speed || 240) * (p.walkRate || 1) : 240;
    stopAnim();
    disposeMedia();
    bubble.classList.remove('show');
    greetEl.textContent = p.greeting + ' ' + p.emoji;
    msgEl.textContent = p.text;

    media = makeMedia(p.media);
    walker = p.walk && p.walkMedia ? makeMedia(p.walkMedia, p.walkRate) : null;
    charEl.appendChild((walker || media).el);
    actor.style.display = 'block';
    actor.style.opacity = '0';
    await Promise.race([
      Promise.all([media.ready, walker ? walker.ready : null]),
      new Promise((r) => setTimeout(r, 3000))
    ]);
    if (my !== token) return;

    const W = window.innerWidth;
    const aw = Math.max(actor.offsetWidth, 160);
    const margin = 170;
    const centre = W * 0.5 + (Math.random() - 0.5) * W * 0.3;
    let tx = Math.max(margin, Math.min(W - aw - margin, centre - aw / 2));

    const stand = () => {
      // Switch from the walking video to the standing picture and keep it centred.
      if (walker) {
        charEl.innerHTML = '';
        charEl.appendChild(media.el);
        charEl.style.transform = 'none';
        const aw2 = Math.max(actor.offsetWidth, 120);
        tx = tx + (aw - aw2) / 2;
      }
      const t0 = performance.now();
      bubble.classList.add('show');
      if (p.say) {
        speak(p.speak ? p.text : '');
        replyTimer = setTimeout(doLeave, Math.max(4000, Math.min(15000, p.text.length * 80)));
      }
      const idle = (now) => {
        if (my !== token) return;
        const t = (now - t0) / 1000;
        place(tx, 2 + Math.sin(t * 2) * 2, 0);
        raf = requestAnimationFrame(idle);
      };
      raf = requestAnimationFrame(idle);
    };

    if (!p.walk) {
      place(tx, 0, 0);
      actor.style.opacity = '1';
      stand();
      return;
    }

    // Walk in from the left edge. A walking video already moves its legs, so no bobbing then.
    const speed = walker ? (p.walkMedia.speed || 240) * (p.walkRate || 1) : 240;
    const bounce = walker ? 0 : 1;
    let x = -aw - 20;
    let prev = performance.now();
    let t = 0;
    place(x, 0, 0);
    actor.style.opacity = '1';
    const walkIn = (now) => {
      if (my !== token) return;
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      t += dt;
      x += speed * dt;
      const bob = Math.abs(Math.sin(t * 9)) * 10 * bounce;
      const tilt = Math.sin(t * 9) * 3 * bounce;
      if (x >= tx) { place(tx, 0, 0); stand(); return; }
      place(x, bob, tilt);
      raf = requestAnimationFrame(walkIn);
    };
    raf = requestAnimationFrame(walkIn);
  });

  function doLeave() {
    clearTimeout(replyTimer);
    try { speechSynthesis.cancel(); } catch (e) {}
    const my = ++token;
    stopAnim();
    bubble.classList.remove('show');
    window.buddy.interactive(false);
    const finish = () => {
      if (my !== token) return;
      actor.style.display = 'none';
      disposeMedia();
      window.buddy.done();
    };
    const m = /translate\(([-\d.]+)px/.exec(actor.style.transform || '');
    const hasWalk = !!m;
    let x = hasWalk ? parseFloat(m[1]) : 0;
    const W = window.innerWidth;
    // Walk off to the right edge, or just fade out when the character does not walk.
    if (!hasWalk || !curWalk) { actor.style.opacity = '0'; setTimeout(finish, 250); return; }
    let prev = performance.now();
    let t = 0;
    let leaveSpeed = 320;
    let bounce = 1;
    if (walker) {
      charEl.innerHTML = '';
      charEl.appendChild(walker.el);
      charEl.style.transform = 'none';
      leaveSpeed = leaveWalkSpeed;
      bounce = 0;
    }
    const step = (now) => {
      if (my !== token) return;
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      t += dt;
      x += leaveSpeed * dt;
      place(x, Math.abs(Math.sin(t * 9)) * 10 * bounce, Math.sin(t * 9) * 3 * bounce);
      if (x > W + 20) { finish(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  window.buddy.onLeave(doLeave);

  // Show the reply (after Yes or Remind me later) for a moment, then walk away.
  window.buddy.onReply((text) => {
    clearTimeout(replyTimer);
    greetEl.style.display = 'none';
    btnsEl.style.display = 'none';
    msgEl.textContent = text;
    replyTimer = setTimeout(doLeave, 3200);
  });

  // Only the bubble should catch mouse clicks; the rest of the screen stays click-through.
  let over = false;
  document.addEventListener('mousemove', (e) => {
    const now = !!(e.target && e.target.closest && e.target.closest('.bubble'));
    if (now !== over) { over = now; window.buddy.interactive(now); }
  });

  document.getElementById('yes').onclick = () => window.buddy.action('yes');
  document.getElementById('later').onclick = () => window.buddy.action('later');
</script>
</body>
</html>
